[project]
name = "edawr-backend"
version = "2.0.0"
description = "Django REST Framework backend for the eDawr storefront, admin console and rider app."
# Django 6.1 requires 3.12, and .python-version pins 3.14, which is what the
# lockfile resolved against and what Render's native runtime reads to pick an
# interpreter. The old ">=3.11" floor described a combination nothing has ever
# installed.
requires-python = ">=3.12"

# Direct dependencies only -- the things this code imports. Everything these
# pull in transitively (asgiref, sqlparse, jsonschema, ...) is resolved and
# pinned in uv.lock, not listed here.
#
# Lower bounds, not exact pins: pyproject declares what is COMPATIBLE, uv.lock
# records what is INSTALLED. See docs/uv.md.
dependencies = [
    # --- the framework ---
    "django>=5.2.17",              # ORM, migrations, settings, manage.py, URLconf
    "djangorestframework>=3.18.0", # serializers, APIView, permissions, renderers
    # --- glue ---
    "django-cors-headers>=4.9.0",  # the CORS middleware Django has no built-in for
    "dj-database-url>=3.1.2",      # turns DATABASE_URL into Django's DATABASES dict
    "python-dotenv>=1.2.2",        # loads .env (pydantic-settings used to do this)
    "PyJWT>=2.13.0",               # signs/verifies the admin bearer token
    "drf-spectacular>=0.30.0",     # OpenAPI schema + the Swagger UI at /docs
    "redis>=8.1.0",                # backs CACHES when CACHE_URL is set
    # --- serving it ---
    # The WSGI server the container runs. `manage.py runserver` is a development
    # tool: one thread, an auto-reloader, and it refuses to serve anything it
    # considers unsafe. Never the thing on the other end of a public URL.
    "gunicorn>=26.0.0",
    # The Postgres driver. [binary] ships prebuilt wheels, so the image needs no
    # libpq or compiler at build time. Unused when DATABASE_URL is SQLite.
    "psycopg[binary]>=3.3.4",
]

[tool.uv]
# This is an application, not a library -- nothing imports `edawr-backend` from
# elsewhere. `package = false` tells uv to install the dependencies but skip
# building/installing this project itself, which is what you want for a service
# you run in place with `uv run manage.py runserver`.
package = false

[dependency-groups]
# Not installed in production -- render.yaml builds with `uv sync --no-dev`.
dev = [
    # A production WSGI server that runs on Windows. gunicorn is POSIX-only
    # (it needs fork and fcntl), so on Windows the only thing that starts is
    # `manage.py runserver`, whose own start-up banner tells you not to serve
    # with it. That leaves a developer here with no way to reproduce production
    # behaviour -- real concurrency, no auto-reloader, DEBUG off -- short of
    # building the container.
    #
    # waitress closes that gap and nothing more. It is NOT what production
    # runs: the container serves with gunicorn under config/gunicorn.py, and
    # that file is where the worker model and the timeouts are decided. See
    # deployment.md.
    "waitress>=3.0.2",
]
